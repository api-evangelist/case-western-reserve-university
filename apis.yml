aid: case-western-reserve-university
name: Case Western Reserve University
x-type: university
x-category: Private Research University
description: >-
  Case Western Reserve University (CWRU) is a private research university in Cleveland, Ohio,
  founded 1826 and a member of the Association of American Universities. It operates no public
  developer portal and no public API program: api.case.edu, developer.case.edu and
  developers.case.edu do not resolve, case.edu/llms.txt and /.well-known/security.txt both return
  404, and its GitHub organization (github.com/cwru) holds six repositories of which four are
  archived web-template tooling last touched in 2016-17. What CWRU does operate, and what this
  profile records, is a small set of genuinely institution-run identity and harvesting surfaces —
  a Shibboleth SAML 2.0 Identity Provider on login.case.edu registered in InCommon
  (urn:mace:incommon:case.edu, scoped to case.edu and eight school subdomains), an Apereo CAS
  single sign-on service on the same host, and an open OAI-PMH 2.0 provider for Scholarly Commons
  at commons.case.edu — alongside tenancies it holds on other people's platforms (bepress Digital
  Commons, Ex Libris Primo through the OhioLINK consortium, Tableau Server, Leepfrog CourseLeaf,
  Microsoft Entra ID) and its registration in the Crossref and ROR registries. Every entry below
  carries an x-operator saying who actually runs the thing described. No vendor contract is saved
  under CWRU's name.
