  - aid: case-western-reserve-university:scholarly-commons-oai-pmh
    name: Scholarly Commons @ CWRU — OAI-PMH 2.0 provider
    x-operator: tenant
    description: >-
      An open OAI-PMH 2.0 metadata provider on CWRU's own host. Identify reports repositoryName
      "Scholarly Commons @ Case Western Reserve University", repositoryIdentifier commons.case.edu,
      earliestDatestamp 2000-01-19, sample identifier oai:commons.case.edu:bejte-1005.
      ListMetadataFormats and ListSets both return 200, and ListSets enumerates CWRU-specific
      collections (publication:begun, publication:baker-nord-works,
      publication:beguncenter-reports and more). Recorded as `tenant` rather than `institution`:
      the host, the repository name, the collections and the content are CWRU's, but the software
      is bepress Digital Commons and the Identify adminEmail is dc-support@elsevier.com. Elsevier's
      generic Digital Commons contract is deliberately NOT saved under CWRU's slug — the
      harvestable OAI-PMH surface is the institutional fact, and it is real.
    humanURL: https://commons.case.edu/
    baseURL: https://commons.case.edu/do/oai/
    tags:
      - Research Repository
