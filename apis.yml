x-coverage:
  state: covered
  reason: covered
  detail: >-
    CWRU publishes no public API program and no developer portal, and that absence was probed
    rather than assumed: api.case.edu, developer.case.edu, developers.case.edu, classes.case.edu,
    its.case.edu, maps.case.edu and status.case.edu all fail to resolve (curl exit 0/000), and
    case.edu/llms.txt and case.edu/.well-known/security.txt both return 404. Nothing was blocked
    to us except LinkedIn (HTTP 999, its standard bot challenge, not a dead page) — every other
    surface was read directly. What IS here was found and verified: the InCommon-registered
    Shibboleth IdP scoped to case.edu and eight school subdomains, an Apereo CAS SSO service on
    the same host, an open OAI-PMH 2.0 provider for Scholarly Commons, a Microsoft Entra ID
    tenant, a Crossref membership with six prefixes and 475 DOIs, and a ROR record. Four vendor
    platforms carry CWRU tenancies (bepress Digital Commons, Ex Libris Primo via OhioLINK, Tableau
    Server, Leepfrog CourseLeaf) and every one is recorded as a relationship with x-operator
    tenant — no vendor contract is saved under CWRU's name. Two honest negatives are recorded
    rather than hidden: CWRU has no DataCite membership at all, and its self-hosted SAML metadata
    endpoint at login.case.edu/idp/shibboleth serves a stale dev descriptor. Marked `covered`
    because the institution's real footprint is fully mapped, not because it is large.
